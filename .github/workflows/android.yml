name: App Android (APK)

# Compila o app Android sempre que a pasta android/ muda (ou manualmente em Actions › Run workflow)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.QD_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar o APK
        env:
          QD_KEYSTORE_PASSWORD: ${{ secrets.QD_KEYSTORE_PASSWORD }}
        run: |
          if [ "$TEM_CHAVE" = "true" ]; then
            export QD_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/assinatura/quantumdrive.jks"
            export QD_KEY_ALIAS=quantumdrive
            export QD_KEY_PASSWORD="$QD_KEYSTORE_PASSWORD"
            echo "Assinando com a chave oficial do Quantum Drive."
          else
            echo "::warning::Segredo QD_KEYSTORE_PASSWORD não cadastrado: APK de teste (não será publicado)."
          fi
          gradle -p android assembleRelease -PnumeroBuild=${{ github.run_number }} --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk QuantumDrive.apk
          ls -la QuantumDrive.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: QuantumDrive-apk
          path: QuantumDrive.apk

      - name: Publicar para download
        if: env.TEM_CHAVE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quantum Drive para Android 1.0.${{ github.run_number }}
          make_latest: true
          files: QuantumDrive.apk
          body: |
            App Android do Quantum Drive — aluguel de carros 100% elétricos BYD.

            **Como instalar:** baixe o `QuantumDrive.apk` no celular, abra o arquivo e toque em **Instalar**.
            Se o Android pedir, ative **Permitir desta fonte** nas configurações.
            Para atualizar, é só instalar a versão nova por cima: suas reservas continuam salvas.
